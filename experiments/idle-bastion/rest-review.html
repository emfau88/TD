<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPIRE · Mara & Ilyra · Ruhebilder</title>
  <style>
    @font-face{font-family:Pixel;src:url('./assets/ui/fonts/PixelifySans.ttf')}
    *{box-sizing:border-box}body{margin:0;background:#0d191d;color:#e8dfc9;font:15px/1.5 system-ui,sans-serif}
    main{max-width:960px;margin:auto;padding:26px 24px 30px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#c7a76b;text-transform:uppercase;margin:0}
    h1{font:36px/1.2 Pixel,serif;margin:7px 0 10px}.intro{color:#b4bebc;margin:0 0 20px}
    .toolbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0}label{cursor:pointer;display:flex;align-items:center;gap:7px;min-height:36px}input{accent-color:#e4ba6b}
    .portraits{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}h2{font:25px Pixel,serif;margin:8px 0}
    .stage{display:flex;justify-content:center;overflow:hidden;border:1px solid #58605a;border-radius:6px;background:#15272e}
    .sprite{width:100%;max-width:384px;aspect-ratio:3/4;overflow:hidden;position:relative}.sprite img{display:block;width:100%;height:100%;image-rendering:pixelated}
    .ilyra img{transform:translateX(-12.5%) scale(1.1);transform-origin:62.5% 70.3125%}
    body:has(#light:checked) .stage{background:#d8ddd4}body:has(#room:checked) .stage{background:linear-gradient(#12202722,#07101499),url('./assets/runtime/room.webp') 40% center/cover}
    figcaption{color:#bcc7c3;font-size:13px;margin-top:10px}a{color:#e3be78}footer{border-top:1px solid #36494b;color:#91a4a7;font-size:12px;margin-top:23px;padding-top:14px}
    @media(max-width:620px){main{padding:20px 16px}.portraits{grid-template-columns:1fr;gap:24px}h1{font-size:30px}.sprite{max-width:340px}}
  </style>
</head>
<body><main>
  <p class="eyebrow">SPIRE · lokale Bildprobe · T11</p>
  <h1>Zwei feste Ruhebilder.</h1>
  <p class="intro">Mara und Ilyra als Ausgangsbilder für die weitere Animation. Bestehende Verbesserungen übernommen, ohne neue Bildgenerierung.</p>
  <div class="toolbar" role="group" aria-label="Hintergrund">
    <label><input type="radio" name="background" id="dark" checked>Dunkel</label>
    <label><input type="radio" name="background" id="light">Hell</label>
    <label><input type="radio" name="background" id="room">Taverne</label>
  </div>
  <div class="portraits">
    <figure><h2>Mara</h2><div class="stage"><div class="sprite"><img src="./assets/mara-tavern/rest-reference/rest.webp" width="384" height="512" alt="Mara in ihrer Ruhepose mit der verbesserten dunklen Haarkontur"></div></div><figcaption>Verbesserte Haarkontur · offene Augen · feste Ruhepose<br><a href="./assets/mara-tavern/rest-reference/rest.png" target="_blank" rel="noopener">Transparentes PNG ansehen</a></figcaption></figure>
    <figure><h2>Ilyra</h2><div class="stage"><div class="sprite ilyra"><img src="./assets/ilyra-tavern/rest-reference/rest.webp" width="384" height="512" alt="Ilyra ohne Speer in ihrer Ruhepose mit lesbarer Nase und Mund"></div></div><figcaption>Lesbare Nase und Mund · offene Augen · ohne Speer<br><a href="./assets/ilyra-tavern/rest-reference/rest.png" target="_blank" rel="noopener">Transparentes PNG ansehen</a></figcaption></figure>
  </div>
  <footer>Statische Referenzbilder zur Ansicht. Noch keine neue Animation und nicht im veröffentlichten Spiel eingebunden.</footer>
</main></body></html>
