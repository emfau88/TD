<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111c20">
  <title>SPIRE · Frost &amp; Heroes Preview</title>
  <style>
    :root { color-scheme: dark; font: 17px/1.55 system-ui,sans-serif; color: #e8e6d9; background: #111c20; }
    * { box-sizing: border-box; } body { margin: 0; padding: 28px 18px 50px; }
    main { max-width: 850px; margin: auto; } h1 { font-size: clamp(1.9rem,5vw,2.8rem); line-height: 1.1; margin: 12px 0 24px; }
    h2 { margin-top: 0; font-size: 1.2rem; } p { max-width: 70ch; } .eyebrow { color: #dcc28b; letter-spacing: .12em; font-size: .8rem; }
    .cards { display: grid; gap: 16px; margin: 28px 0; } article { border: 1px solid #506361; border-radius: 10px; padding: 22px; background: #1c2c30; }
    button, select { font: inherit; min-height: 46px; padding: 8px 16px; border: 1px solid #bba474; border-radius: 5px; background: #dfc18a; color: #172326; cursor: pointer; }
    button { font-weight: 700; } button:disabled { opacity: .6; cursor: wait; } :focus-visible { outline: 3px solid #90e2e3; outline-offset: 4px; }
    label { display: flex; gap: 10px; align-items: center; justify-content: flex-end; } select { padding: 4px 8px; background: #1c2c30; color: #eee; }
    small { color: #bac9c4; } a { color: #f0d49c; } [role=alert] { color: #ffb6a4; }
    @media(min-width: 740px) { .cards { grid-template-columns: repeat(3,1fr); } article { display: flex; flex-direction: column; } article button { margin-top: auto; } }
  </style>
</head>
<body>
  <main>
    <label>Language / Sprache <select id="language"><option value="en">English</option><option value="de">Deutsch</option></select></label>
    <p class="eyebrow">SPIRE · BRANCH PREVIEW</p>
    <h1 data-text="Frost & Figuren direkt testen">Frost &amp; Heroes Preview</h1>
    <p data-text="Drei vorbereitete Szenarien ohne Durchspielen. Jeder Start erzeugt einen neuen Testspielstand; deine normale Partie bleibt erhalten."></p>
    <div class="cards">
      <article><h2 data-text="1 · Kostenloser Frost"></h2><p data-text="25 Gold, Forschung bezahlt, Frostbausatz bereit. Folge dem Hinweis zum ersten kostenlosen Frostturm."></p><button data-scenario="frost" data-text="Frost testen"></button></article>
      <article><h2 data-text="2 · Figurensteuerung"></h2><p data-text="Mara und Ilyra sind bereit. Figur antippen, dann freien Boden; ein neues Ziel ersetzt den Weg. Zweiter Figurentipp öffnet ihr Menü."></p><button data-scenario="heroes" data-text="Figuren testen"></button></article>
      <article><h2 data-text="3 · Ilyras Einführung"></h2><p data-text="Ilyra ist frisch rekrutiert. Folge der Standortempfehlung, warte ihre Ankunft ab und ziele ihre erste Sternensalve selbst."></p><button data-scenario="ilyra" data-text="Ilyra kennenlernen"></button></article>
    </div>
    <p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p>
    <p data-text="Falls eine Rückkehrkarte erscheint: Fortsetzen wählen. Im Figurentest helfen die Porträts unten beim Finden der Figuren. Desktop: Rechtsklick bewegt, Esc beendet die Auswahl. Mobil: Ziehen verschiebt die Karte."></p>
    <p><small data-text="Die Figurentests verwenden eine aufgezeichnete Verteidigung nach Welle 40. Taverne II wird regulär bezahlt. Das sind Bedienproben, keine neuen Balance-Messungen."></small></p>
    <p><small data-text="Die Spieladresse mit ?probe=… kannst du zum Fortsetzen speichern. Zurück zu dieser Seite erzeugt beim nächsten Start eine neue Probe. Teststände liegen nur in diesem Browser."></small></p>
    <p><a href="https://github.com/emfau88/TD/tree/codex/frost-kit-hero-controls" data-text="Zum Testbranch auf GitHub"></a></p>
    <noscript>JavaScript is required. / Bitte JavaScript aktivieren.</noscript>
  </main>
  <script type="module" src="/src/feature-check.ts"></script>
</body>
</html>
