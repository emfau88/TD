name: Deploy SPIRE test build

on:
  push:
    branches: [codex/idle-bastion-vertical-slice]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}idle-bastion/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build existing game and Idle Bastion
        run: |
          npm run build
          npm run idle:build
          mkdir -p dist/idle-bastion
          cp -R experiments/idle-bastion/dist/. dist/idle-bastion/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
