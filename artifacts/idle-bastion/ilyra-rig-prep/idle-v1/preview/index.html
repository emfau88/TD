<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilyra · Erste Idle</title>
<style>
*{box-sizing:border-box}body{margin:0 auto;max-width:1040px;padding:22px;background:#15202d;color:#eef3fa;font:16px/1.5 system-ui}h1{font-size:26px;margin:0}p{color:#c0cddd;margin:8px 0 16px}main{display:grid;grid-template-columns:minmax(0,650px) 1fr;gap:24px}.stage{--stage-height:77vh;width:min(100%,calc(var(--stage-height)*.6));position:relative;aspect-ratio:768/1280;max-height:var(--stage-height);background:#e6e0d4;border-radius:12px;overflow:hidden;margin:auto}.stage canvas{display:block;width:100%;height:100%}.dark{background:#172436}.zoom{aspect-ratio:768/870;width:min(100%,calc(var(--stage-height)*.882758))}.zoom canvas{position:absolute;width:100%;height:auto;top:-15%}button,select{font:inherit;padding:9px 12px;border:1px solid #7890aa;border-radius:8px;background:#2b4058;color:white;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}label{display:block;margin:16px 0 6px}input[type=range]{width:100%}a{color:#aed4ff}.small{font-size:13px}#error{color:#ffc8ba}@media(max-width:650px){body{padding:12px}h1{font-size:23px}main{grid-template-columns:1fr}.stage{--stage-height:64vh}aside{padding:0}nav{margin:10px 0}}
</style>
<h1>Ilyra · Erste ruhige Idle</h1><p>Atmung, Blinzeln und leicht nachlaufende Haare und Stoffe. Die Brust folgt dezent der Atmung und der Körperbewegung.</p>
<main><div class="stage" id="stage"><canvas id="canvas" width="768" height="1280" aria-label="Ilyras sechs Sekunden lange Idle-Animation"></canvas></div><aside><nav><button id="play" disabled>Wird geladen …</button><button id="rest">Ruhebild</button></nav><nav><button id="zoom">Oberkörper vergrößern</button><button id="background">Dunkler Hintergrund</button></nav><label for="frame">Zeit <output id="counter">0,00 / 6,00 s</output></label><input id="frame" type="range" min="0" max="179" step="1" value="0"><label for="speed">Geschwindigkeit</label><select id="speed"><option value="1">Normal</option><option value="0.5">Halbes Tempo</option></select><p id="status" class="small">Die Bewegung wird beim Abspielen geladen.</p><p id="error" role="status"></p><p><a href="Ilyra-Idle.gif" download>GIF herunterladen</a></p><p class="small">Separates Experiment · keine Änderung am Spiel.<br><a href="../../shoulder-comparison/preview/index.html">Vorherige Gelenkprobe</a></p></aside></main>
<script>
const $=s=>document.querySelector(s),ctx=$('#canvas').getContext('2d'),cache=new Map();let manifest,rest,playing=false,frame=0,origin=0,speed=1,token=0;
function image(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Bild konnte nicht geladen werden: '+src));im.src=src})}
function sheet(index){if(!cache.has(index))cache.set(index,image(manifest.sheets[index].file));return cache.get(index)}
function stop(){playing=false;$('#play').textContent='Abspielen'}
async function draw(n){const request=++token,index=Math.floor(n/8);try{const im=await sheet(index);if(request!==token)return;ctx.clearRect(0,0,768,1280);ctx.drawImage(im,n%8%4*768,Math.floor(n%8/4)*1280,768,1280,0,0,768,1280);frame=n;$('#frame').value=n;$('#counter').textContent=(n/30).toFixed(2).replace('.',',')+' / 6,00 s';$('#status').textContent='6 Sekunden · 30 Bilder pro Sekunde';const next=(index+1)%manifest.sheets.length;sheet(next).catch(fail);for(const key of cache.keys())if(key!==index&&key!==next)cache.delete(key)}catch(e){fail(e)}}
function fail(e){stop();$('#error').textContent=e.message}
$('#play').onclick=async()=>{if(playing){stop();return}await draw(frame);if($('#error').textContent)return;origin=performance.now()-frame/30/speed*1000;playing=true;$('#play').textContent='Pause'};
$('#rest').onclick=()=>{stop();++token;ctx.clearRect(0,0,768,1280);ctx.drawImage(rest,0,0);$('#status').textContent='Freigegebenes Ruhebild';frame=0;$('#frame').value=0;$('#counter').textContent='0,00 / 6,00 s'};
$('#frame').oninput=e=>{stop();draw(+e.target.value)};
$('#speed').onchange=e=>{speed=+e.target.value;origin=performance.now()-frame/30/speed*1000};
$('#background').onclick=()=>{$('#background').textContent=$('#stage').classList.toggle('dark')?'Heller Hintergrund':'Dunkler Hintergrund'};
$('#zoom').onclick=()=>{$('#zoom').textContent=$('#stage').classList.toggle('zoom')?'Ganze Figur':'Oberkörper vergrößern'};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
Promise.all([fetch('manifest.json').then(r=>{if(!r.ok)throw Error('Animationsdaten fehlen');return r.json()}),image('rest.png')]).then(([m,im])=>{manifest=m;rest=im;ctx.drawImage(rest,0,0);$('#play').disabled=false;stop()}).catch(fail);
function tick(t){if(playing){const n=Math.floor(Math.max(0,t-origin)*speed*.03)%180;if(n!==frame)draw(n)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
