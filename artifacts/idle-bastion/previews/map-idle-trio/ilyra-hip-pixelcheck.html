<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ilyra · Pixelprobe</title><link rel="icon" href="data:,">
<style>*{box-sizing:border-box}body{margin:0;background:#101c24;color:#f3e7cf;font:14px system-ui,sans-serif}main{width:304px;margin:auto}header{padding:16px 8px 8px;line-height:1.5}h1{font-size:19px;margin:0 0 8px}p{margin:0 0 10px}button{background:#243c49;border:1px solid #58727e;color:#f3e7cf;padding:9px 12px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{border-color:#e5c681;color:#e5c681}img{display:block;width:304px;height:600px;image-rendering:pixelated}a{color:#e5c681;display:block;padding:12px 8px}.stage{width:304px;height:280px;position:relative;border:1px solid #45606a;background:#1a2a35;margin-top:8px}canvas{position:absolute;left:23px;top:12px;width:256px;height:256px;image-rendering:pixelated}label{display:block;padding:10px 0}input{width:100%}.hint{color:#b6c8cc;font-size:12px;padding:4px 8px}nav{display:flex;gap:6px;flex-wrap:wrap}output{font-variant-numeric:tabular-nums}</style></head>
<body><main><header><h1>Ilyra · Darstellung prüfen</h1><p>Dieselbe V3-Bewegung. Diese Ansicht bleibt 304 Pixel breit und verwendet keine Bildglättung.</p></header>
<img src="Ilyra-Hip-Shift-Pixelcheck.gif" width="304" height="600" alt="Die unveränderte Hüftbewegung in einer schmaleren 1×- und 4×-Vorschau.">
<a href="Ilyra-Hip-Shift-Pixelcheck.gif" download>GIF speichern</a>
<header><h1>Bewegung einzeln ansehen</h1><nav><button id="play" aria-pressed="false">Abspielen</button><button id="prev">← Bild</button><button id="next">Bild →</button></nav><label>Bild <output id="number">0</output> / 16<input id="frame" type="range" min="0" max="16" value="0" step="1"></label></header>
<div class="stage"><canvas id="sprite" width="256" height="256" aria-label="Ausgewähltes Einzelbild vierfach vergrößert"></canvas></div><p class="hint">Keine neue Animationsfassung. So lassen sich Darstellungsunschärfe und springende Konturen getrennt beurteilen.</p>
</main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#frame'),number=document.querySelector('#number'),play=document.querySelector('#play');
let current=0,running=false,timer=null,images=[];const durations=[600,120,120,120,120,120,120,120,480,120,120,120,120,120,120,120,640];
function draw(){ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,256,256);ctx.drawImage(images[current],0,0,256,256);slider.value=current;number.value=current;}
function stop(){running=false;clearTimeout(timer);play.textContent='Abspielen';play.setAttribute('aria-pressed','false');}
function step(){timer=setTimeout(()=>{current=(current+1)%17;draw();if(running)step();},durations[current]);}
Promise.all(Array.from({length:17},(_,i)=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=`ilyra-hip/rig-v3/${String(i).padStart(2,'0')}.png`;}))).then(loaded=>{images=loaded;draw();
play.onclick=()=>{if(running)stop();else{running=true;play.textContent='Pause';play.setAttribute('aria-pressed','true');step();}};
slider.oninput=()=>{stop();current=Number(slider.value);draw();};
document.querySelector('#prev').onclick=()=>{stop();current=(current+16)%17;draw();};
document.querySelector('#next').onclick=()=>{stop();current=(current+1)%17;draw();};
}).catch(()=>{number.value='Ladefehler';play.disabled=true;});
</script></body></html>
