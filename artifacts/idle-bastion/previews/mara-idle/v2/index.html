<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mara · Idle V2</title>
<style>body{margin:0;background:#0d191d;color:#efd6a1;font:16px system-ui;display:grid;justify-items:center;gap:16px;padding:18px}canvas{width:min(640px,100%);height:auto;image-rendering:pixelated;border-radius:12px}button{font:inherit;color:inherit;background:#21343b;border:1px solid #7a795f;border-radius:7px;padding:10px 20px;cursor:pointer}p{margin:0;font-size:14px;color:#a6c0bd;text-align:center;max-width:620px}</style>
<canvas width="640" height="480" aria-label="Original links, klarere Idle-Bewegung rechts; darunter Spielgröße"></canvas>
<button id="toggle">Pause</button><p>V2 · Bestehende Pixel, vier klare Körperhaltungen. Separate Bewegungsvorschau.</p>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),original=new Image();original.src='../original-front-64.png';
const frames=[{down:0,ms:1100},{down:1,ms:200},{down:2,ms:260},{down:3,ms:480},{down:2,ms:260},{down:1,ms:200}],total=2500;
let paused=false,time=0,last=performance.now(),fixed;
function sprite(x,y,scale,down=0){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.imageSmoothingEnabled=false;
 // Unmodified source texture. Boots/lower legs stay planted; the upper body moves
 // in whole pixels over the hip overlap. No repaint, fractional warp or AI redraw.
 ctx.drawImage(original,0,41,64,23,0,41,64,23);
 ctx.drawImage(original,0,0,64,41,0,down,64,41);ctx.restore();}
function draw(ms){let n=ms%total,i=0;while(i<frames.length-1&&n>=frames[i].ms)n-=frames[i++].ms;const down=frames[i].down;
 ctx.imageSmoothingEnabled=false;ctx.fillStyle='#10252b';ctx.fillRect(0,0,640,480);ctx.fillStyle='#183238';ctx.fillRect(16,62,294,263);ctx.fillRect(330,62,294,263);
 ctx.fillStyle='#efd6a1';ctx.textAlign='center';ctx.font='600 22px system-ui';ctx.fillText('Mara · Klarere Idle-Bewegung',320,32);
 ctx.font='14px system-ui';ctx.fillStyle='#9fbab8';ctx.fillText('Original',163,59);ctx.fillText('V2 · 4× Ansicht',477,59);
 ctx.fillStyle='#0c1a21';for(const x of [163,477]){ctx.beginPath();ctx.ellipse(x,302,43,9,0,0,Math.PI*2);ctx.fill();}
 sprite(35,78,4);sprite(349,78,4,down);
 ctx.strokeStyle='#4b6260';ctx.beginPath();ctx.moveTo(36,346);ctx.lineTo(604,346);ctx.stroke();ctx.font='14px system-ui';ctx.fillStyle='#d7d7bd';ctx.fillText('Spielmaßstab',320,374);
 ctx.fillStyle='#214438';ctx.fillRect(178,391,284,72);ctx.fillStyle='#152d2b';for(const x of [250,390]){ctx.beginPath();ctx.ellipse(x,449,11,3,0,0,Math.PI*2);ctx.fill();}
 sprite(218,393,1);sprite(358,393,1,down);window.previewFrame=i;window.previewOffset=down;
}
function step(now){if(!paused)time+=now-last;last=now;if(original.complete&&original.naturalWidth)draw(fixed??time);requestAnimationFrame(step);}requestAnimationFrame(step);
document.querySelector('#toggle').onclick=()=>{paused=!paused;document.querySelector('#toggle').textContent=paused?'Abspielen':'Pause';};
window.renderAt=ms=>{fixed=ms;draw(ms);};window.ready=original.decode();window.sequence=frames;
</script></html>
